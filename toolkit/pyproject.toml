[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "custom-connector-framework-toolkit"
version = "0.1.0"
description = "Toolkit for one-method custom connectors that reconcile full snapshots to service-configured S3 destinations for Amazon Bedrock Managed Knowledge Bases, Amazon Quick Knowledge Bases, or plain S3."
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.122",
    "pydantic>=2.14.2",
    "filetype>=1.2.0",
    "ccf-api-models",
]

[project.scripts]
ccf-connector = "custom_connector_framework.launcher:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    "coverage>=7.17.0",
    "moto[s3,dynamodb]>=5.2.5",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
]

[tool.uv.sources]
ccf-api-models = { path = "../api/packages/ccf-api-models" }

[tool.hatch.build.targets.wheel]
packages = ["src/custom_connector_framework"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S", "C901", "PLR2004"]
# UP042 (StrEnum) is intentionally disabled: project style uses `(str, Enum)`
# for all finite value sets, which keeps member values plain `str` subclasses.
ignore = ["S101", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Tests assert on literal expected values and counts (PLR2004) and use fakes
# that intentionally take **kwargs: object (no production coupling).
"tests/**" = ["PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "filetype.*", "ccf_api_models.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["src"]
