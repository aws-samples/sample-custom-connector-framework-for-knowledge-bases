<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Helvetica Neue, Arial, sans-serif">
<title>How a CCF connector job runs</title>
<desc>A client account registers a connector and starts jobs through the CCF framework account's API. The framework account owns the scheduler, encrypted state, and AWS Batch execution. Batch pulls the registered connector image, assumes a cross-account source-access role to read source data, and writes documents and an optional sidecar to the framework's S3 destination. Depending on the configured destination mode, a successful job starts Amazon Bedrock ingestion, or Amazon Quick Index reads the bucket on its own schedule.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/>
  </marker>
</defs>
<rect x="0" y="0" width="1000" height="560" fill="#FFFFFF"/>
<text x="500" y="34" font-size="26" font-weight="bold" text-anchor="middle" fill="#1F1F1F">How a CCF connector job runs</text>

<g id="boundary-client">
  <rect x="30" y="65" width="210" height="225" rx="14" fill="#EEF4FB" stroke="#2F5F9E" stroke-width="2"/>
  <text x="48" y="90" font-size="19" font-weight="bold" fill="#2F5F9E">Client account</text>
  <g id="card-connector-image">
    <rect x="50" y="110" width="170" height="60" rx="10" fill="#F8F9FA" stroke="#4A4A4A" stroke-width="1.5"/>
    <use href="icon:lucide/container" x="64" y="127" width="26" height="26" color="#2F5F9E"/>
    <text x="102" y="145" font-size="16" fill="#1F1F1F">Connector image</text>
  </g>
  <g id="card-source-role">
    <rect x="50" y="190" width="170" height="60" rx="10" fill="#F8F9FA" stroke="#4A4A4A" stroke-width="1.5"/>
    <use href="icon:aws/aws-identity-access-management-role" x="64" y="207" width="26" height="26"/>
    <text x="102" y="225" font-size="16" fill="#1F1F1F">Source role</text>
  </g>
</g>

<g id="card-source-system">
  <rect x="50" y="305" width="170" height="60" rx="10" fill="#F8F9FA" stroke="#4A4A4A" stroke-width="1.5" stroke-dasharray="4 4"/>
  <use href="icon:lucide/server" x="64" y="322" width="26" height="26" color="#4A4A4A"/>
  <text x="102" y="340" font-size="16" fill="#1F1F1F">Source system</text>
</g>

<g id="boundary-ccf">
  <rect x="270" y="65" width="440" height="335" rx="14" fill="#EAF6F1" stroke="#1F7A5A" stroke-width="3"/>
  <text x="288" y="90" font-size="19" font-weight="bold" fill="#1F7A5A">CCF framework account (the service)</text>
  <g id="card-api">
    <rect x="290" y="110" width="170" height="60" rx="10" fill="#F8F9FA" stroke="#4A4A4A" stroke-width="1.5"/>
    <use href="icon:aws/amazon-api-gateway" x="304" y="127" width="26" height="26"/>
    <text x="342" y="145" font-size="16" fill="#1F1F1F">API + backend</text>
  </g>
  <g id="card-state">
    <rect x="500" y="110" width="170" height="60" rx="10" fill="#F8F9FA" stroke="#4A4A4A" stroke-width="1.5"/>
    <use href="icon:aws/amazon-dynamodb" x="514" y="127" width="26" height="26"/>
    <text x="552" y="145" font-size="16" fill="#1F1F1F">Encrypted state</text>
  </g>
  <g id="card-scheduler">
    <rect x="290" y="190" width="170" height="60" rx="10" fill="#F8F9FA" stroke="#4A4A4A" stroke-width="1.5"/>
    <use href="icon:aws/amazon-eventbridge" x="304" y="207" width="26" height="26"/>
    <text x="342" y="225" font-size="16" fill="#1F1F1F">Scheduler</text>
  </g>
  <g id="card-batch">
    <rect x="500" y="190" width="170" height="60" rx="10" fill="#F8F9FA" stroke="#4A4A4A" stroke-width="1.5"/>
    <use href="icon:aws/aws-batch" x="514" y="207" width="26" height="26"/>
    <text x="552" y="225" font-size="16" fill="#1F1F1F">Batch execution</text>
  </g>
  <g id="card-s3">
    <rect x="395" y="270" width="170" height="60" rx="10" fill="#F8F9FA" stroke="#4A4A4A" stroke-width="1.5"/>
    <use href="icon:aws/amazon-simple-storage-service" x="409" y="287" width="26" height="26"/>
    <text x="447" y="305" font-size="16" fill="#1F1F1F">S3 destination</text>
  </g>
</g>

<g id="boundary-connected">
  <rect x="730" y="65" width="240" height="225" rx="14" fill="#FFF5EB" stroke="#B5651D" stroke-width="2"/>
  <text x="748" y="90" font-size="19" font-weight="bold" fill="#B5651D">Connected services</text>
  <g id="card-bedrock">
    <rect x="750" y="110" width="200" height="60" rx="10" fill="#F8F9FA" stroke="#4A4A4A" stroke-width="1.5"/>
    <use href="icon:aws/amazon-bedrock" x="764" y="127" width="26" height="26"/>
    <text x="802" y="138" font-size="15" fill="#1F1F1F">Amazon Bedrock</text>
    <text x="802" y="156" font-size="15" fill="#1F1F1F">Knowledge Base</text>
  </g>
  <g id="card-quick">
    <rect x="750" y="190" width="200" height="60" rx="10" fill="#F8F9FA" stroke="#4A4A4A" stroke-width="1.5"/>
    <text x="764" y="225" font-size="16" fill="#1F1F1F">Amazon Quick Index</text>
  </g>
</g>

<path d="M240,130 L270,130" stroke="#232F3E" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<circle cx="255" cy="130" r="10" fill="#232F3E"/>
<text x="255" y="134" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="255" y="114" font-size="12" text-anchor="middle" fill="#3A3A3A">Call API</text>

<path d="M270,175 L240,175" stroke="#232F3E" stroke-width="2" fill="none" stroke-dasharray="3 6" marker-end="url(#arrow)"/>
<circle cx="255" cy="175" r="10" fill="#232F3E"/>
<text x="255" y="179" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="255" y="159" font-size="12" text-anchor="middle" fill="#3A3A3A">Pull image</text>

<path d="M270,220 L240,220" stroke="#232F3E" stroke-width="2" fill="none" stroke-dasharray="3 6" marker-end="url(#arrow)"/>
<circle cx="255" cy="220" r="10" fill="#232F3E"/>
<text x="255" y="224" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="255" y="240" font-size="12" text-anchor="middle" fill="#3A3A3A">Assume role</text>

<path d="M135,250 L135,303" stroke="#232F3E" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<circle cx="135" cy="277" r="10" fill="#232F3E"/>
<text x="135" y="281" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="150" y="281" font-size="12" fill="#3A3A3A">Read source data</text>

<path d="M565,250 L480,268" stroke="#232F3E" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<circle cx="535" cy="258" r="10" fill="#232F3E"/>
<text x="535" y="262" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="575" y="262" font-size="12" fill="#3A3A3A">Write + sidecar</text>

<path d="M690,268 L694,268 L694,145 L748,145" stroke="#232F3E" stroke-width="2" fill="none" stroke-dasharray="3 6" marker-end="url(#arrow)"/>
<circle cx="694" cy="188" r="10" fill="#232F3E"/>
<text x="694" y="192" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="680" y="184" font-size="12" text-anchor="end" fill="#3A3A3A">Start Bedrock ingestion</text>

<path d="M748,225 L718,225 L718,350 L480,350 L480,333" stroke="#232F3E" stroke-width="2" fill="none" stroke-dasharray="3 6" marker-end="url(#arrow)"/>
<circle cx="600" cy="350" r="10" fill="#232F3E"/>
<text x="600" y="354" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="600" y="368" font-size="12" text-anchor="middle" fill="#3A3A3A">Reads on its own schedule</text>

<g id="legend">
  <rect x="30" y="420" width="940" height="120" rx="10" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
  <text x="46" y="442" font-size="14" font-weight="bold" fill="#1F1F1F">Legend</text>

  <rect x="46" y="454" width="16" height="16" fill="#EEF4FB" stroke="#2F5F9E"/>
  <text x="68" y="466" font-size="13" fill="#1F1F1F">Client account (you deploy this)</text>

  <rect x="330" y="454" width="16" height="16" fill="#EAF6F1" stroke="#1F7A5A"/>
  <text x="352" y="466" font-size="13" fill="#1F1F1F">CCF framework account (the service)</text>

  <rect x="660" y="454" width="16" height="16" fill="#FFF5EB" stroke="#B5651D"/>
  <text x="682" y="466" font-size="13" fill="#1F1F1F">Connected services, chosen by destination mode</text>

  <line x1="46" y1="484" x2="86" y2="484" stroke="#232F3E" stroke-width="2"/>
  <text x="94" y="488" font-size="13" fill="#1F1F1F">Always happens</text>

  <line x1="270" y1="484" x2="310" y2="484" stroke="#232F3E" stroke-width="2" stroke-dasharray="3 6"/>
  <text x="318" y="488" font-size="13" fill="#1F1F1F">Cross-account or depends on destination mode</text>

  <rect x="660" y="478" width="170" height="24" fill="none" stroke="#4A4A4A" stroke-dasharray="4 4" rx="4"/>
  <text x="668" y="494" font-size="13" fill="#1F1F1F">Dashed card: outside AWS, not CCF-owned</text>

  <text x="46" y="512" font-size="12" fill="#3A3A3A">Numbers show the order of the flow. CCF = Custom Connector Framework. SigV4 (flow 1) = AWS Signature Version 4, the request-signing method CcfClient uses.</text>
</g>
</svg>