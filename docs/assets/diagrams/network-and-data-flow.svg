<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="1000" height="820">
  <title>Network and data flow: what a job can reach</title>
  <desc>A job runs on AWS Fargate in the private subnets of the service account's job VPC. It reaches the destination bucket through an S3 gateway endpoint, and everything else over HTTPS through a NAT gateway: the source, the framework API, and the AWS APIs it calls with the tenant's roles.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/>
    </marker>
    <!-- Logo definitions, copied from docs/assets/images/logo.svg. -->
    <linearGradient id="ccf-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#0E4A5C"/>
    </linearGradient>
    <linearGradient id="ccf-source" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DB9FF"/>
      <stop offset="1" stop-color="#3B8DF5"/>
    </linearGradient>
    <linearGradient id="ccf-spoke-0" x1="22.0" y1="60.0" x2="58.0" y2="60.0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="ccf-spoke-1" x1="35.8" y1="31.6" x2="58.0" y2="60.0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="ccf-spoke-2" x1="35.8" y1="88.4" x2="58.0" y2="60.0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="ccf-spoke-3" x1="66.7" y1="25.1" x2="58.0" y2="60.0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="ccf-spoke-4" x1="66.7" y1="94.9" x2="58.0" y2="60.0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="ccf-hub" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0" stop-color="#8BF0AE"/>
      <stop offset="1" stop-color="#22C3B0"/>
    </linearGradient>
    <linearGradient id="ccf-delivery" x1="70" y1="0" x2="106" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#7EE8A2"/>
    </linearGradient>
    <filter id="ccf-lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#06121F" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="ccf-wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F6FD1"/>
      <stop offset="1" stop-color="#11998A"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="820" fill="#FFFFFF"/>
  <text x="10" y="44" font-family="Helvetica" font-size="26" fill="#1F1F1F">Network and data flow: what a job can reach</text>
  <g id="ccf-lockup" transform="translate(770,10)">
    <g id="ccf-logo" transform="scale(0.4000)">
      <rect width="120" height="120" rx="26" fill="url(#ccf-tile)"/>
      <circle id="ccf-orbit" cx="58.0" cy="60.0" r="36.0" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="12"/>
      <g id="ccf-spokes">
        <path d="M22.0 61.8 L58.0 64.2 L58.0 55.8 L22.0 58.2 Z" fill="url(#ccf-spoke-0)"/>
        <path d="M34.4 32.7 L54.7 62.6 L61.3 57.4 L37.3 30.5 Z" fill="url(#ccf-spoke-1)"/>
        <path d="M37.3 89.5 L61.3 62.6 L54.7 57.4 L34.4 87.3 Z" fill="url(#ccf-spoke-2)"/>
        <path d="M65.0 24.6 L53.9 59.0 L62.1 61.0 L68.5 25.5 Z" fill="url(#ccf-spoke-3)"/>
        <path d="M68.5 94.5 L62.1 59.0 L53.9 61.0 L65.0 95.4 Z" fill="url(#ccf-spoke-4)"/>
      </g>
      <path id="ccf-delivery-spoke" d="M70 55 L101 55 A5 5 0 0 1 101 65 L70 65 Z" fill="url(#ccf-delivery)"/>
      <g id="ccf-sources" fill="url(#ccf-source)" filter="url(#ccf-lift)">
        <circle cx="22.0" cy="60.0" r="6.5"/>
        <circle cx="35.8" cy="31.6" r="6.5"/>
        <circle cx="35.8" cy="88.4" r="6.5"/>
        <circle cx="66.7" cy="25.1" r="6.5"/>
        <circle cx="66.7" cy="94.9" r="6.5"/>
      </g>
      <g id="ccf-hub-node" filter="url(#ccf-lift)">
        <circle cx="58.0" cy="60.0" r="15" fill="url(#ccf-hub)"/>
        <circle cx="58.0" cy="60.0" r="5.5" fill="#0D3550"/>
      </g>
    </g>
    <text x="58" y="21" font-family="Helvetica" font-size="17" font-weight="bold" fill="#0B1F3A">Custom Connector</text>
    <text x="58" y="42" font-family="Helvetica" font-size="17" font-weight="bold" fill="url(#ccf-wordmark)">Framework</text>
  </g>

  <g id="aws-cloud">
    <rect x="10" y="70" width="830" height="660" fill="none" stroke="#232F3E" stroke-width="1.5"/>
    <use href="icon:aws/aws-cloud-logo" x="10" y="70" width="30" height="30"/>
    <text x="48" y="91" font-family="Helvetica" font-size="17" fill="#232F3E">AWS Cloud</text>
  </g>
  <g id="region">
    <rect x="25" y="110" width="800" height="605" fill="none" stroke="#00A4A6" stroke-width="1.5" stroke-dasharray="6 4"/>
    <use href="icon:aws/region" x="25" y="110" width="26" height="26"/>
    <text x="58" y="129" font-family="Helvetica" font-size="17" fill="#00777A">AWS Region</text>
  </g>
  <g id="service-account">
    <rect x="40" y="150" width="770" height="350" rx="8" fill="#FFFFFF" stroke="#E7157B" stroke-width="1.5"/>
    <use href="icon:aws/aws-account" x="40" y="150" width="28" height="28"/>
    <text x="76" y="170" font-family="Helvetica" font-size="17" fill="#B0105D">CCF service account</text>
  </g>
  <g id="job-vpc">
    <rect x="55" y="190" width="470" height="280" fill="none" stroke="#8C4FFF" stroke-width="1.5"/>
    <use href="icon:aws/virtual-private-cloud-vpc" x="55" y="190" width="26" height="26"/>
    <text x="88" y="209" font-family="Helvetica" font-size="17" fill="#6B2FD9">Job VPC</text>
  </g>
  <g id="private-subnets">
    <rect x="70" y="230" width="200" height="200" fill="#E6F6F7" stroke="#00A4A6" stroke-width="1.5"/>
    <use href="icon:aws/private-subnet" x="70" y="230" width="24" height="24"/>
    <text x="100" y="248" font-family="Helvetica" font-size="16" fill="#00777A">Private subnets</text>
  </g>
  <g id="public-subnets">
    <rect x="290" y="230" width="220" height="200" fill="#F2F6E8" stroke="#7AA116" stroke-width="1.5"/>
    <use href="icon:aws/public-subnet" x="290" y="230" width="24" height="24"/>
    <text x="320" y="248" font-family="Helvetica" font-size="16" fill="#3F6B0B">Public subnets</text>
  </g>
  <g id="tenant-account">
    <rect x="40" y="520" width="770" height="180" rx="8" fill="#FFFFFF" stroke="#E7157B" stroke-width="1.5"/>
    <use href="icon:aws/aws-account" x="40" y="520" width="28" height="28"/>
    <text x="76" y="540" font-family="Helvetica" font-size="17" fill="#B0105D">Tenant account</text>
  </g>
  <g id="source">
    <rect x="855" y="230" width="135" height="160" rx="8" fill="none" stroke="#7D8998" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="868" y="254" font-family="Helvetica" font-size="17" fill="#5A6573">Internet</text>
  </g>

  <g id="job">
    <rect x="90" y="270" width="160" height="100" rx="8" fill="#F8F9FA" stroke="#4A4A4A"/>
    <use href="icon:aws/aws-fargate" x="146" y="278" width="48" height="48"/>
    <text x="170" y="344" font-family="Helvetica" font-size="16" text-anchor="middle" fill="#1F1F1F">AWS Batch job</text>
    <text x="170" y="362" font-family="Helvetica" font-size="15" text-anchor="middle" fill="#3A3A3A">connector, log router</text>
  </g>
  <g id="nat-gateway">
    <rect x="340" y="270" width="120" height="100" rx="8" fill="#F8F9FA" stroke="#4A4A4A"/>
    <use href="icon:aws/amazon-vpc-nat-gateway" x="376" y="278" width="48" height="48"/>
    <text x="400" y="344" font-family="Helvetica" font-size="16" text-anchor="middle" fill="#1F1F1F">NAT</text>
    <text x="400" y="362" font-family="Helvetica" font-size="16" text-anchor="middle" fill="#1F1F1F">gateway</text>
  </g>
  <g id="s3-gateway-endpoint">
    <use href="icon:aws/amazon-vpc-endpoints" x="146" y="446" width="48" height="48"/>
    <text x="202" y="490" font-family="Helvetica" font-size="16" fill="#3A3A3A">S3 gateway endpoint</text>
  </g>
  <g id="api-gateway">
    <rect x="620" y="200" width="120" height="100" rx="8" fill="#F8F9FA" stroke="#4A4A4A"/>
    <use href="icon:aws/amazon-api-gateway" x="656" y="208" width="48" height="48"/>
    <text x="680" y="274" font-family="Helvetica" font-size="16" text-anchor="middle" fill="#1F1F1F">Framework</text>
    <text x="680" y="292" font-family="Helvetica" font-size="16" text-anchor="middle" fill="#1F1F1F">API</text>
  </g>
  <g id="github">
    <rect x="862" y="270" width="120" height="100" rx="8" fill="#F8F9FA" stroke="#4A4A4A"/>
    <use href="icon:lucide/git-branch" x="898" y="278" width="48" height="48" color="#1F1F1F"/>
    <text x="922" y="344" font-family="Helvetica" font-size="16" text-anchor="middle" fill="#1F1F1F">Source,</text>
    <text x="922" y="362" font-family="Helvetica" font-size="15" text-anchor="middle" fill="#3A3A3A">such as GitHub</text>
  </g>
  <g id="bucket">
    <rect x="210" y="590" width="120" height="100" rx="8" fill="#F8F9FA" stroke="#4A4A4A"/>
    <use href="icon:aws/amazon-simple-storage-service" x="246" y="598" width="48" height="48"/>
    <text x="270" y="664" font-family="Helvetica" font-size="16" text-anchor="middle" fill="#1F1F1F">Amazon S3</text>
    <text x="270" y="682" font-family="Helvetica" font-size="15" text-anchor="middle" fill="#3A3A3A">destination</text>
  </g>
  <g id="tenant-roles">
    <rect x="360" y="590" width="120" height="100" rx="8" fill="#F8F9FA" stroke="#4A4A4A"/>
    <use href="icon:aws/aws-identity-access-management-role" x="396" y="598" width="48" height="48"/>
    <text x="420" y="664" font-family="Helvetica" font-size="16" text-anchor="middle" fill="#1F1F1F">IAM roles</text>
    <text x="420" y="682" font-family="Helvetica" font-size="15" text-anchor="middle" fill="#3A3A3A">by AWS STS</text>
  </g>
  <g id="secret">
    <rect x="510" y="590" width="120" height="100" rx="8" fill="#F8F9FA" stroke="#4A4A4A"/>
    <use href="icon:aws/aws-secrets-manager" x="546" y="598" width="48" height="48"/>
    <text x="570" y="664" font-family="Helvetica" font-size="16" text-anchor="middle" fill="#1F1F1F">Secrets</text>
    <text x="570" y="682" font-family="Helvetica" font-size="16" text-anchor="middle" fill="#1F1F1F">Manager</text>
  </g>
  <g id="log-group">
    <rect x="660" y="590" width="120" height="100" rx="8" fill="#F8F9FA" stroke="#4A4A4A"/>
    <use href="icon:aws/amazon-cloudwatch-logs" x="696" y="598" width="48" height="48"/>
    <text x="720" y="664" font-family="Helvetica" font-size="16" text-anchor="middle" fill="#1F1F1F">CloudWatch</text>
    <text x="720" y="682" font-family="Helvetica" font-size="16" text-anchor="middle" fill="#1F1F1F">Logs</text>
  </g>

  <g id="job-to-nat">
    <line x1="250" y1="330" x2="338" y2="330" stroke="#4A4A4A" stroke-width="2" marker-end="url(#head)"/>
  </g>
  <g id="job-to-endpoint">
    <line x1="170" y1="370" x2="170" y2="444" stroke="#4A4A4A" stroke-width="2"/>
  </g>
  <g id="flow-4">
    <polyline points="170,494 170,510 270,510 270,588" fill="none" stroke="#4A4A4A" stroke-width="2" marker-end="url(#head)"/>
    <circle cx="270" cy="556" r="11" fill="#232F3E"/>
    <text x="270" y="561" font-family="Helvetica" font-size="14" text-anchor="middle" fill="#FFFFFF">4</text>
    <text x="288" y="562" font-family="Helvetica" font-size="16" fill="#3A3A3A">Write files</text>
  </g>
  <g id="flow-3">
    <line x1="460" y1="340" x2="860" y2="340" stroke="#4A4A4A" stroke-width="2" marker-end="url(#head)"/>
    <circle cx="700" cy="340" r="11" fill="#232F3E"/>
    <text x="700" y="345" font-family="Helvetica" font-size="14" text-anchor="middle" fill="#FFFFFF">3</text>
    <text x="700" y="366" font-family="Helvetica" font-size="16" text-anchor="middle" fill="#3A3A3A">Read the source</text>
  </g>
  <g id="flow-5">
    <line x1="460" y1="290" x2="618" y2="250" stroke="#4A4A4A" stroke-width="2" marker-end="url(#head)"/>
    <circle cx="560" cy="265" r="11" fill="#232F3E"/>
    <text x="560" y="270" font-family="Helvetica" font-size="14" text-anchor="middle" fill="#FFFFFF">5</text>
    <text x="680" y="320" font-family="Helvetica" font-size="16" text-anchor="middle" fill="#3A3A3A">Record documents</text>
  </g>
  <g id="tenant-apis">
    <polyline points="400,370 400,566 720,566" fill="none" stroke="#4A4A4A" stroke-width="2"/>
    <line x1="420" y1="566" x2="420" y2="588" stroke="#4A4A4A" stroke-width="2" marker-end="url(#head)"/>
    <line x1="570" y1="566" x2="570" y2="588" stroke="#4A4A4A" stroke-width="2" marker-end="url(#head)"/>
    <line x1="720" y1="566" x2="720" y2="588" stroke="#4A4A4A" stroke-width="2" marker-end="url(#head)"/>
    <circle cx="442" cy="578" r="11" fill="#232F3E"/>
    <text x="442" y="583" font-family="Helvetica" font-size="14" text-anchor="middle" fill="#FFFFFF">1</text>
    <circle cx="592" cy="578" r="11" fill="#232F3E"/>
    <text x="592" y="583" font-family="Helvetica" font-size="14" text-anchor="middle" fill="#FFFFFF">2</text>
    <circle cx="742" cy="578" r="11" fill="#232F3E"/>
    <text x="742" y="583" font-family="Helvetica" font-size="14" text-anchor="middle" fill="#FFFFFF">6</text>
    <text x="440" y="554" font-family="Helvetica" font-size="16" fill="#3A3A3A">AWS APIs, HTTPS</text>
  </g>

  <g id="legend">
    <rect x="10" y="750" width="980" height="56" rx="8" fill="#FFFFFF" stroke="#C8C8C8"/>
    <circle cx="36" cy="778" r="11" fill="#232F3E"/>
    <text x="36" y="783" font-family="Helvetica" font-size="14" text-anchor="middle" fill="#FFFFFF">1</text>
    <text x="56" y="784" font-family="Helvetica" font-size="17" fill="#3A3A3A">Order of a job's steps</text>
    <line x1="260" y1="778" x2="305" y2="778" stroke="#4A4A4A" stroke-width="2" marker-end="url(#head)"/>
    <text x="316" y="784" font-family="Helvetica" font-size="17" fill="#3A3A3A">Outbound request</text>
    <rect x="490" y="768" width="30" height="20" rx="4" fill="none" stroke="#E7157B" stroke-width="1.5"/>
    <text x="530" y="784" font-family="Helvetica" font-size="17" fill="#3A3A3A">AWS account</text>
    <rect x="660" y="768" width="30" height="20" fill="none" stroke="#7D8998" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="700" y="784" font-family="Helvetica" font-size="17" fill="#3A3A3A">Outside AWS</text>
  </g>
</svg>
