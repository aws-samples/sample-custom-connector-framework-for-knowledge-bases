      <use href="icon:lucide/calendar-clock" x="390.0" y="120.5" width="30" height="30" color="#1F6FD1"/>
      <text x="361.0" y="141.5" font-family="Helvetica" font-size="18" font-weight="bold" text-anchor="end" fill="#0B1F3A">Schedules</text>
    </g>
    <g id="blog-build-a-connector-full-and-incremental-sync">
      <circle cx="405.0" cy="464.5" r="31" fill="#FFFFFF" stroke="#CFE3EE" stroke-width="1.5" filter="url(#blog-build-a-connector-soft)"/>
      <use href="icon:lucide/refresh-cw" x="390.0" y="449.5" width="30" height="30" color="#1F6FD1"/>
      <text x="361.0" y="470.5" font-family="Helvetica" font-size="18" font-weight="bold" text-anchor="end" fill="#0B1F3A">Full and incremental sync</text>
    </g>
    <g id="blog-build-a-connector-retries-and-resume">
      <circle cx="595.0" cy="464.5" r="31" fill="#FFFFFF" stroke="#CFE3EE" stroke-width="1.5" filter="url(#blog-build-a-connector-soft)"/>
      <use href="icon:lucide/rotate-ccw" x="580.0" y="449.5" width="30" height="30" color="#1F6FD1"/>
      <text x="639.0" y="470.5" font-family="Helvetica" font-size="18" font-weight="bold" fill="#0B1F3A">Retries and resume</text>
    </g>
    <g id="blog-build-a-connector-ingestion">
      <circle cx="690.0" cy="300.0" r="31" fill="#FFFFFF" stroke="#CFE3EE" stroke-width="1.5" filter="url(#blog-build-a-connector-soft)"/>
