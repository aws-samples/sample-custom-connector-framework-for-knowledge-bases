    <line x1="422.0" y1="164.9" x2="453.0" y2="218.6" stroke="url(#blog-build-a-connector-spoke-1)" stroke-width="4" stroke-linecap="round"/>
    <line x1="422.0" y1="435.1" x2="453.0" y2="381.4" stroke="url(#blog-build-a-connector-spoke-2)" stroke-width="4" stroke-linecap="round"/>
    <line x1="578.0" y1="435.1" x2="547.0" y2="381.4" stroke="url(#blog-build-a-connector-spoke-3)" stroke-width="4" stroke-linecap="round"/>
    <line x1="656.0" y1="300.0" x2="594.0" y2="300.0" stroke="url(#blog-build-a-connector-spoke-4)" stroke-width="4" stroke-linecap="round"/>
    <line x1="578.0" y1="164.9" x2="547.0" y2="218.6" stroke="url(#blog-build-a-connector-spoke-5)" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g id="hub">
