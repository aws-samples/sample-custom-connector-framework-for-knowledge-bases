<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 666" width="1000" height="666">
  <title>Faster time to production for every connector</title>
  <desc>The Custom Connector Framework at the hub, surrounded by what it manages for every connector: schedules, full and incremental sync, retries and resume, ingestion, and the security boundary between accounts. Your code that reads the source is the one part you write. The benefits listed below are faster time to production, managed connector infrastructure, control over what's ingested, and a simpler toolkit than raw SDKs.</desc>
  <defs>
    <linearGradient id="blog-build-a-connector-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F8FD"/>
      <stop offset="1" stop-color="#E9F8F1"/>
    </linearGradient>
    <linearGradient id="blog-build-a-connector-hub" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#0E4A5C"/>
    </linearGradient>
    <linearGradient id="blog-build-a-connector-hub-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#7EE8A2"/>
    </linearGradient>
    <linearGradient id="blog-build-a-connector-dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="blog-build-a-connector-wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38D1E0"/>
      <stop offset="1" stop-color="#7EE8A2"/>
    </linearGradient>
    <filter id="blog-build-a-connector-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0B1F3A" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="blog-build-a-connector-spoke-0" x1="344.0" y1="300.0" x2="406.0" y2="300.0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="blog-build-a-connector-spoke-1" x1="422.0" y1="164.9" x2="453.0" y2="218.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="blog-build-a-connector-spoke-2" x1="422.0" y1="435.1" x2="453.0" y2="381.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="blog-build-a-connector-spoke-3" x1="578.0" y1="435.1" x2="547.0" y2="381.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="blog-build-a-connector-spoke-4" x1="656.0" y1="300.0" x2="594.0" y2="300.0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="blog-build-a-connector-spoke-5" x1="578.0" y1="164.9" x2="547.0" y2="218.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <!-- Logo definitions, copied from docs/assets/images/logo.svg. -->
    <linearGradient id="ccf-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#0E4A5C"/>
    </linearGradient>
    <linearGradient id="ccf-source" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DB9FF"/>
      <stop offset="1" stop-color="#3B8DF5"/>
    </linearGradient>
    <linearGradient id="ccf-spoke-0" x1="22.0" y1="60.0" x2="58.0" y2="60.0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="ccf-spoke-1" x1="35.8" y1="31.6" x2="58.0" y2="60.0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="ccf-spoke-2" x1="35.8" y1="88.4" x2="58.0" y2="60.0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="ccf-spoke-3" x1="66.7" y1="25.1" x2="58.0" y2="60.0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="ccf-spoke-4" x1="66.7" y1="94.9" x2="58.0" y2="60.0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="ccf-hub" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0" stop-color="#8BF0AE"/>
      <stop offset="1" stop-color="#22C3B0"/>
    </linearGradient>
    <linearGradient id="ccf-delivery" x1="70" y1="0" x2="106" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#7EE8A2"/>
    </linearGradient>
    <filter id="ccf-lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#06121F" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1000" height="666" fill="url(#blog-build-a-connector-background)"/>
  <text x="500.0" y="52" font-family="Helvetica" font-size="30" font-weight="bold" text-anchor="middle" fill="#0B1F3A">Faster time to production for every connector</text>
  <text x="500.0" y="84" font-family="Helvetica" font-size="18" text-anchor="middle" fill="#4A5A6A">You write the code that reads your source. CCF manages everything else.</text>
  <circle cx="500.0" cy="300.0" r="190.0" fill="none" stroke="#D3E6F1" stroke-width="24" stroke-opacity="0.7"/>
  <g id="spokes">
