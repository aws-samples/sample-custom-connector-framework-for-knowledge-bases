      <text x="266.0" y="298.0" font-family="Helvetica" font-size="18" font-weight="bold" text-anchor="end" fill="#0B1F3A">Your code</text>
      <text x="266.0" y="319.0" font-family="Helvetica" font-size="15" text-anchor="end" fill="#4A5A6A">reads the source</text>
    </g>
    <g id="blog-build-a-connector-schedules">
