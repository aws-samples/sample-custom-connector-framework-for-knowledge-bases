    <text x="548.0" y="566.0" font-family="Helvetica" font-size="17" font-weight="bold" fill="#0B1F3A">Managed connector infrastructure</text>
    <rect x="162.0" y="594.0" width="330.0" height="44" rx="22" fill="#FFFFFF" stroke="#CFE3EE" stroke-width="1.5"/>
    <circle cx="186.0" cy="616.0" r="7" fill="url(#blog-build-a-connector-dot)"/>
    <text x="202.0" y="622.0" font-family="Helvetica" font-size="17" font-weight="bold" fill="#0B1F3A">You control what's ingested</text>
    <rect x="508.0" y="594.0" width="330.0" height="44" rx="22" fill="#FFFFFF" stroke="#CFE3EE" stroke-width="1.5"/>
    <circle cx="532.0" cy="616.0" r="7" fill="url(#blog-build-a-connector-dot)"/>
    <text x="548.0" y="622.0" font-family="Helvetica" font-size="17" font-weight="bold" fill="#0B1F3A">A simpler toolkit than raw SDKs</text>
