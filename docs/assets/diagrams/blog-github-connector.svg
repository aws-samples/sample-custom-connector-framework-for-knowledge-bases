<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 666" width="1000" height="666">
  <title>How the GitHub connector stays current</title>
  <desc>The example GitHub connector at the hub, surrounded by its design choices: one collection per repository, skipping repositories that didn't change, streaming archives, leaving out files that aren't worth indexing, staying within GitHub's rate limits, and making every document filterable. The results listed below are weekly jobs that finish, renames that don't re-index, deleted repositories that drop out, and a template for your own connector.</desc>
  <defs>
    <linearGradient id="blog-github-connector-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F8FD"/>
      <stop offset="1" stop-color="#E9F8F1"/>
    </linearGradient>
    <linearGradient id="blog-github-connector-hub" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#0E4A5C"/>
    </linearGradient>
    <linearGradient id="blog-github-connector-hub-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#7EE8A2"/>
    </linearGradient>
    <linearGradient id="blog-github-connector-dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="blog-github-connector-wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38D1E0"/>
      <stop offset="1" stop-color="#7EE8A2"/>
    </linearGradient>
    <filter id="blog-github-connector-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0B1F3A" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="blog-github-connector-spoke-0" x1="422.0" y1="164.9" x2="453.0" y2="218.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="blog-github-connector-spoke-1" x1="344.0" y1="300.0" x2="406.0" y2="300.0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="blog-github-connector-spoke-2" x1="422.0" y1="435.1" x2="453.0" y2="381.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="blog-github-connector-spoke-3" x1="578.0" y1="435.1" x2="547.0" y2="381.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="blog-github-connector-spoke-4" x1="656.0" y1="300.0" x2="594.0" y2="300.0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="blog-github-connector-spoke-5" x1="578.0" y1="164.9" x2="547.0" y2="218.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <!-- Logo definitions, copied from docs/assets/images/logo.svg. -->
    <linearGradient id="ccf-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#0E4A5C"/>
    </linearGradient>
    <linearGradient id="ccf-source" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DB9FF"/>
      <stop offset="1" stop-color="#3B8DF5"/>
    </linearGradient>
    <linearGradient id="ccf-spoke-0" x1="22.0" y1="60.0" x2="58.0" y2="60.0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="ccf-spoke-1" x1="35.8" y1="31.6" x2="58.0" y2="60.0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="ccf-spoke-2" x1="35.8" y1="88.4" x2="58.0" y2="60.0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="ccf-spoke-3" x1="66.7" y1="25.1" x2="58.0" y2="60.0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="ccf-spoke-4" x1="66.7" y1="94.9" x2="58.0" y2="60.0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="ccf-hub" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0" stop-color="#8BF0AE"/>
      <stop offset="1" stop-color="#22C3B0"/>
    </linearGradient>
    <linearGradient id="ccf-delivery" x1="70" y1="0" x2="106" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#7EE8A2"/>
    </linearGradient>
    <filter id="ccf-lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#06121F" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1000" height="666" fill="url(#blog-github-connector-background)"/>
  <text x="500.0" y="52" font-family="Helvetica" font-size="30" font-weight="bold" text-anchor="middle" fill="#0B1F3A">How the GitHub connector stays current</text>
  <text x="500.0" y="84" font-family="Helvetica" font-size="18" text-anchor="middle" fill="#4A5A6A">The choices that keep large organizations indexed without rereading everything.</text>
  <circle cx="500.0" cy="300.0" r="190.0" fill="none" stroke="#D3E6F1" stroke-width="24" stroke-opacity="0.7"/>
  <g id="spokes">
    <line x1="422.0" y1="164.9" x2="453.0" y2="218.6" stroke="url(#blog-github-connector-spoke-0)" stroke-width="4" stroke-linecap="round"/>
    <line x1="344.0" y1="300.0" x2="406.0" y2="300.0" stroke="url(#blog-github-connector-spoke-1)" stroke-width="4" stroke-linecap="round"/>
    <line x1="422.0" y1="435.1" x2="453.0" y2="381.4" stroke="url(#blog-github-connector-spoke-2)" stroke-width="4" stroke-linecap="round"/>
    <line x1="578.0" y1="435.1" x2="547.0" y2="381.4" stroke="url(#blog-github-connector-spoke-3)" stroke-width="4" stroke-linecap="round"/>
    <line x1="656.0" y1="300.0" x2="594.0" y2="300.0" stroke="url(#blog-github-connector-spoke-4)" stroke-width="4" stroke-linecap="round"/>
    <line x1="578.0" y1="164.9" x2="547.0" y2="218.6" stroke="url(#blog-github-connector-spoke-5)" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g id="hub">
    <circle cx="500.0" cy="300.0" r="94.0" fill="none" stroke="url(#blog-github-connector-hub-ring)" stroke-width="3"/>
    <circle cx="500.0" cy="300.0" r="88.0" fill="url(#blog-github-connector-hub)" filter="url(#blog-github-connector-soft)"/>
    <g id="ccf-logo" transform="translate(456.0,226.0) scale(0.7333)">
    <circle id="ccf-orbit" cx="58.0" cy="60.0" r="36.0" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="12"/>
    <g id="ccf-spokes">
      <path d="M22.0 61.8 L58.0 64.2 L58.0 55.8 L22.0 58.2 Z" fill="url(#ccf-spoke-0)"/>
      <path d="M34.4 32.7 L54.7 62.6 L61.3 57.4 L37.3 30.5 Z" fill="url(#ccf-spoke-1)"/>
      <path d="M37.3 89.5 L61.3 62.6 L54.7 57.4 L34.4 87.3 Z" fill="url(#ccf-spoke-2)"/>
      <path d="M65.0 24.6 L53.9 59.0 L62.1 61.0 L68.5 25.5 Z" fill="url(#ccf-spoke-3)"/>
      <path d="M68.5 94.5 L62.1 59.0 L53.9 61.0 L65.0 95.4 Z" fill="url(#ccf-spoke-4)"/>
    </g>
    <path id="ccf-delivery-spoke" d="M70 55 L101 55 A5 5 0 0 1 101 65 L70 65 Z" fill="url(#ccf-delivery)"/>
    <g id="ccf-sources" fill="url(#ccf-source)" filter="url(#ccf-lift)">
      <circle cx="22.0" cy="60.0" r="6.5"/>
      <circle cx="35.8" cy="31.6" r="6.5"/>
      <circle cx="35.8" cy="88.4" r="6.5"/>
      <circle cx="66.7" cy="25.1" r="6.5"/>
      <circle cx="66.7" cy="94.9" r="6.5"/>
    </g>
    <g id="ccf-hub-node" filter="url(#ccf-lift)">
      <circle cx="58.0" cy="60.0" r="15" fill="url(#ccf-hub)"/>
      <circle cx="58.0" cy="60.0" r="5.5" fill="#0D3550"/>
    </g>
    </g>
    <text x="500.0" y="336.0" font-family="Helvetica" font-size="17" font-weight="bold" text-anchor="middle" fill="#FFFFFF">GitHub connector</text>
    <text x="500.0" y="357.0" font-family="Helvetica" font-size="17" font-weight="bold" text-anchor="middle" fill="url(#blog-github-connector-wordmark)">on CCF</text>
  </g>
  <g id="badges">
    <g id="blog-github-connector-one-collection">
      <circle cx="405.0" cy="135.5" r="31" fill="#FFFFFF" stroke="#CFE3EE" stroke-width="1.5" filter="url(#blog-github-connector-soft)"/>
      <use href="icon:lucide/folder-git-2" x="390.0" y="120.5" width="30" height="30" color="#1F6FD1"/>
      <text x="361.0" y="133.5" font-family="Helvetica" font-size="18" font-weight="bold" text-anchor="end" fill="#0B1F3A">One collection</text>
      <text x="361.0" y="154.5" font-family="Helvetica" font-size="15" text-anchor="end" fill="#4A5A6A">per repository</text>
    </g>
    <g id="blog-github-connector-skip-what">
      <circle cx="310.0" cy="300.0" r="31" fill="#FFFFFF" stroke="#CFE3EE" stroke-width="1.5" filter="url(#blog-github-connector-soft)"/>
      <use href="icon:lucide/skip-forward" x="295.0" y="285.0" width="30" height="30" color="#1F6FD1"/>
      <text x="266.0" y="298.0" font-family="Helvetica" font-size="18" font-weight="bold" text-anchor="end" fill="#0B1F3A">Skip what</text>
      <text x="266.0" y="319.0" font-family="Helvetica" font-size="15" text-anchor="end" fill="#4A5A6A">didn't change</text>
    </g>
    <g id="blog-github-connector-stream-archives">
      <circle cx="405.0" cy="464.5" r="31" fill="#FFFFFF" stroke="#CFE3EE" stroke-width="1.5" filter="url(#blog-github-connector-soft)"/>
      <use href="icon:lucide/package-open" x="390.0" y="449.5" width="30" height="30" color="#1F6FD1"/>
      <text x="361.0" y="470.5" font-family="Helvetica" font-size="18" font-weight="bold" text-anchor="end" fill="#0B1F3A">Stream archives</text>
    </g>
    <g id="blog-github-connector-leave-out-noise">
      <circle cx="595.0" cy="464.5" r="31" fill="#FFFFFF" stroke="#CFE3EE" stroke-width="1.5" filter="url(#blog-github-connector-soft)"/>
      <use href="icon:lucide/funnel" x="580.0" y="449.5" width="30" height="30" color="#1F6FD1"/>
      <text x="639.0" y="470.5" font-family="Helvetica" font-size="18" font-weight="bold" fill="#0B1F3A">Leave out noise</text>
    </g>
    <g id="blog-github-connector-respect-rate-limits">
      <circle cx="690.0" cy="300.0" r="31" fill="#FFFFFF" stroke="#CFE3EE" stroke-width="1.5" filter="url(#blog-github-connector-soft)"/>
      <use href="icon:lucide/gauge" x="675.0" y="285.0" width="30" height="30" color="#1F6FD1"/>
      <text x="734.0" y="306.0" font-family="Helvetica" font-size="18" font-weight="bold" fill="#0B1F3A">Respect rate limits</text>
    </g>
    <g id="blog-github-connector-filterable-documents">
      <circle cx="595.0" cy="135.5" r="31" fill="#FFFFFF" stroke="#CFE3EE" stroke-width="1.5" filter="url(#blog-github-connector-soft)"/>
      <use href="icon:lucide/tags" x="580.0" y="120.5" width="30" height="30" color="#1F6FD1"/>
      <text x="639.0" y="141.5" font-family="Helvetica" font-size="18" font-weight="bold" fill="#0B1F3A">Filterable documents</text>
    </g>
  </g>
  <g id="benefits">
    <rect x="162.0" y="538.0" width="330.0" height="44" rx="22" fill="#FFFFFF" stroke="#CFE3EE" stroke-width="1.5"/>
    <circle cx="186.0" cy="560.0" r="7" fill="url(#blog-github-connector-dot)"/>
    <text x="202.0" y="566.0" font-family="Helvetica" font-size="17" font-weight="bold" fill="#0B1F3A">Weekly jobs that finish</text>
    <rect x="508.0" y="538.0" width="330.0" height="44" rx="22" fill="#FFFFFF" stroke="#CFE3EE" stroke-width="1.5"/>
    <circle cx="532.0" cy="560.0" r="7" fill="url(#blog-github-connector-dot)"/>
    <text x="548.0" y="566.0" font-family="Helvetica" font-size="17" font-weight="bold" fill="#0B1F3A">Renames don't re-index</text>
    <rect x="162.0" y="594.0" width="330.0" height="44" rx="22" fill="#FFFFFF" stroke="#CFE3EE" stroke-width="1.5"/>
    <circle cx="186.0" cy="616.0" r="7" fill="url(#blog-github-connector-dot)"/>
    <text x="202.0" y="622.0" font-family="Helvetica" font-size="17" font-weight="bold" fill="#0B1F3A">Deleted repositories drop out</text>
    <rect x="508.0" y="594.0" width="330.0" height="44" rx="22" fill="#FFFFFF" stroke="#CFE3EE" stroke-width="1.5"/>
    <circle cx="532.0" cy="616.0" r="7" fill="url(#blog-github-connector-dot)"/>
    <text x="548.0" y="622.0" font-family="Helvetica" font-size="17" font-weight="bold" fill="#0B1F3A">A template for your own</text>
  </g>
</svg>
