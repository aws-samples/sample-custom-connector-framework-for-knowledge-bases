      <use href="icon:aws/amazon-simple-storage-service" x="647.2" y="394.9" width="38" height="38"/>
      <text x="710.2" y="411.9" font-family="Helvetica" font-size="18" font-weight="bold" fill="#0B1F3A">Amazon S3</text>
      <text x="710.2" y="432.9" font-family="Helvetica" font-size="15" fill="#4A5A6A">your own pipeline</text>
    </g>
  </g>
  <g id="benefits">
    <rect x="162.0" y="548.0" width="330.0" height="44" rx="22" fill="#FFFFFF" stroke="#CFE3EE" stroke-width="1.5"/>
    <circle cx="186.0" cy="570.0" r="7" fill="url(#hero-dot)"/>
    <text x="202.0" y="576.0" font-family="Helvetica" font-size="17" font-weight="bold" fill="#0B1F3A">Faster time to value</text>
    <rect x="508.0" y="548.0" width="330.0" height="44" rx="22" fill="#FFFFFF" stroke="#CFE3EE" stroke-width="1.5"/>
    <circle cx="532.0" cy="570.0" r="7" fill="url(#hero-dot)"/>
