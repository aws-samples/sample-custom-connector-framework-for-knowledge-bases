      <use href="icon:aws/amazon-quick" x="677.0" y="291.0" width="38" height="38"/>
      <text x="740.0" y="308.0" font-family="Helvetica" font-size="18" font-weight="bold" fill="#0B1F3A">AWS Quick</text>
      <text x="740.0" y="329.0" font-family="Helvetica" font-size="15" fill="#4A5A6A">chat and agents</text>
