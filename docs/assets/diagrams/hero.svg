    <rect x="162.0" y="604.0" width="330.0" height="44" rx="22" fill="#FFFFFF" stroke="#CFE3EE" stroke-width="1.5"/>
    <circle cx="186.0" cy="626.0" r="7" fill="url(#hero-dot)"/>
    <text x="202.0" y="632.0" font-family="Helvetica" font-size="17" font-weight="bold" fill="#0B1F3A">Managed connector infrastructure</text>
    <rect x="508.0" y="604.0" width="330.0" height="44" rx="22" fill="#FFFFFF" stroke="#CFE3EE" stroke-width="1.5"/>
    <circle cx="532.0" cy="626.0" r="7" fill="url(#hero-dot)"/>
    <text x="548.0" y="632.0" font-family="Helvetica" font-size="17" font-weight="bold" fill="#0B1F3A">Full and incremental sync</text>
    <rect x="162.0" y="660.0" width="330.0" height="44" rx="22" fill="#FFFFFF" stroke="#CFE3EE" stroke-width="1.5"/>
    <circle cx="186.0" cy="682.0" r="7" fill="url(#hero-dot)"/>
    <text x="202.0" y="688.0" font-family="Helvetica" font-size="17" font-weight="bold" fill="#0B1F3A">Your data stays in your account</text>
    <rect x="508.0" y="660.0" width="330.0" height="44" rx="22" fill="#FFFFFF" stroke="#CFE3EE" stroke-width="1.5"/>
    <circle cx="532.0" cy="682.0" r="7" fill="url(#hero-dot)"/>
    <text x="548.0" y="688.0" font-family="Helvetica" font-size="17" font-weight="bold" fill="#0B1F3A">One service for every team</text>
