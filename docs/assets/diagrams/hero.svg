      <text x="337.3" y="161.5" font-family="Helvetica" font-size="18" text-anchor="end" fill="#0B1F3A">Code repositories</text>
    </g>
    <g id="source-wikis">
      <circle cx="323.8" cy="224.1" r="30" fill="#FFFFFF" stroke="#CFE3EE" stroke-width="1.5" filter="url(#hero-soft)"/>
      <use href="icon:lucide/book-open" x="308.8" y="209.1" width="30" height="30" color="#1F6FD1"/>
      <text x="281.8" y="230.1" font-family="Helvetica" font-size="18" text-anchor="end" fill="#0B1F3A">Wikis</text>
    </g>
    <g id="source-ticketing-systems">
      <circle cx="304.0" cy="310.0" r="30" fill="#FFFFFF" stroke="#CFE3EE" stroke-width="1.5" filter="url(#hero-soft)"/>
      <use href="icon:lucide/ticket" x="289.0" y="295.0" width="30" height="30" color="#1F6FD1"/>
      <text x="262.0" y="316.0" font-family="Helvetica" font-size="18" text-anchor="end" fill="#0B1F3A">Ticketing systems</text>
    </g>
    <g id="source-knowledge-articles">
      <circle cx="323.8" cy="395.9" r="30" fill="#FFFFFF" stroke="#CFE3EE" stroke-width="1.5" filter="url(#hero-soft)"/>
      <use href="icon:lucide/file-text" x="308.8" y="380.9" width="30" height="30" color="#1F6FD1"/>
      <text x="281.8" y="401.9" font-family="Helvetica" font-size="18" text-anchor="end" fill="#0B1F3A">Knowledge articles</text>
    </g>
    <g id="source-file-shares">
      <circle cx="379.3" cy="464.5" r="30" fill="#FFFFFF" stroke="#CFE3EE" stroke-width="1.5" filter="url(#hero-soft)"/>
      <use href="icon:lucide/folder-open" x="364.3" y="449.5" width="30" height="30" color="#1F6FD1"/>
      <text x="337.3" y="470.5" font-family="Helvetica" font-size="18" text-anchor="end" fill="#0B1F3A">File shares</text>
    </g>
  </g>
