    <use href="icon:aws/aws-lambda" x="241" y="208" width="48" height="48"/>
    <text x="265" y="274" font-family="Helvetica" font-size="16" text-anchor="middle" fill="#1F1F1F">AWS Lambda</text>
    <text x="265" y="292" font-family="Helvetica" font-size="15" text-anchor="middle" fill="#3A3A3A">framework API</text>
  </g>
  <g id="step-functions">
