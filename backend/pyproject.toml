[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "custom-connector-framework-backend"
version = "0.1.0"
description = "Serverless state and job-orchestration service for the Custom Connector Framework: tracks connectors, jobs, documents, and checkpoints in DynamoDB and runs connector containers on AWS Batch."
requires-python = ">=3.14"
dependencies = [
    "aws-lambda-powertools>=3.38.0",
    "pydantic>=2.14.2",
    "aws-xray-sdk>=2.15.0",
    "boto3>=1.43.122",
    "aws-encryption-sdk>=4.0.7,<5",
    "aws-cryptographic-material-providers>=1.11.3,<2",
    "ccf-api-models",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    "coverage>=7.17.0",
    "moto[all]>=5.2.5",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
    "boto3-stubs[batch,bedrock-agent,dynamodb,kms,scheduler]>=1.43.121",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S", "C901", "PLR2004"]
# UP042 (StrEnum): project style uses `(str, Enum)` for finite value sets.
ignore = ["S101", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Tests assert on literal values/counts (PLR2004), use throwaway credentials
# (S105/S106), and deliberately assert broad failure propagation (B017) or
# re-raise without chaining in integ helpers (B904).
"tests/**" = ["PLR2004", "S105", "S106", "B017", "B904"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = ["src"]
exclude = ["tests/", "build/"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "--import-mode=importlib"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.uv.sources]
ccf-api-models = { path = "../api/packages/ccf-api-models" }
