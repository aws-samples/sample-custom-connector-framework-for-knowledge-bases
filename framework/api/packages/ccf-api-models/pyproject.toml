[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccf-api-models"
version = "2026.11.1"
description = "Models, operation catalog, identifiers, and cross-language contracts of the Custom Connector Framework API."
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.3,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ccf_api_models"]
# The OpenAPI document and the contracts ship as package data and are read with importlib.resources.
artifacts = ["src/ccf_api_models/**/*.json"]

[tool.uv]
# Rebuild consumers' installed copy whenever the generated or package sources change.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "src/**/*.json" }]
